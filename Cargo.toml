[package]
name = "gogo-spaces"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Open a configured workspace in your terminal multiplexer with one command"
license = "MIT OR Apache-2.0"
repository = "https://github.com/conorbr/gogo"
readme = "README.md"
keywords = ["herdr", "tmux", "workspace", "terminal", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "gogo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
